# Render.com blueprint — static site for the ArenaBots.io client.
# Deploys this folder as a CDN-served static site.
#
# Setup: In Render, New → Blueprint → point at this repo. Render reads this
# file and provisions the service automatically.
services:
  - type: web
    runtime: static
    name: arenabots-client
    branch: main
    buildCommand: ""                # no build step — plain HTML/JS/CSS
    staticPublishPath: ./
    publishPath: ./
    headers:
      - path: /*
        name: Cache-Control
        value: "public, max-age=60"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=86400, immutable"
    routes:
      # Single-page app — every unknown path falls back to index.html.
      - type: rewrite
        source: /*
        destination: /index.html
